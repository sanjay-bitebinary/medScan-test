<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in - MedScan</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:Inter,Aptos,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at 15% 15%,rgba(13,148,136,.16),transparent 32%),radial-gradient(circle at 85% 12%,rgba(37,99,235,.16),transparent 34%),linear-gradient(145deg,#f2faf8,#f3f7fd);color:#17243a}.box{width:min(440px,calc(100% - 32px));padding:35px;border-radius:24px;background:rgba(255,255,255,.95);border:1px solid #fff;box-shadow:0 30px 90px rgba(31,69,104,.16)}.mark{position:relative;width:54px;height:54px;border-radius:17px;background:linear-gradient(145deg,#2864dc,#0a9b90);box-shadow:0 15px 30px rgba(37,99,235,.23)}.mark:before,.mark:after{content:"";position:absolute;left:50%;top:50%;border-radius:3px;background:#fff;transform:translate(-50%,-50%)}.mark:before{width:19px;height:4px}.mark:after{width:4px;height:19px}.eyebrow{margin-top:20px;color:#2783a4;font-size:9px;text-transform:uppercase;letter-spacing:1px;font-weight:800}h1{margin:5px 0 6px;font-size:28px;letter-spacing:-.7px;color:#10233f}p{margin:0 0 24px;color:#6a788b;font-size:11px;line-height:1.5}.field{margin:13px 0}.field label{display:block;font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:#6a788b;margin-bottom:6px}.field input{width:100%;height:45px;border:1px solid #d9e5ec;border-radius:11px;padding:0 12px;outline:none}.field input:focus{border-color:#2864dc;box-shadow:0 0 0 3px rgba(40,100,220,.09)}button{width:100%;height:45px;border:0;border-radius:11px;margin-top:8px;background:linear-gradient(135deg,#2864dc,#3b75e4);color:#fff;font-weight:800;cursor:pointer;box-shadow:0 12px 24px rgba(37,99,235,.2)}.error{padding:10px 12px;border-radius:10px;background:#ffe7e8;color:#b82f36;font-size:11px;margin-bottom:14px}.flow{display:flex;justify-content:center;gap:7px;margin-top:16px;color:#8796a7;font-size:9px}.flow b{color:#2b6ddd}</style>
</head><body><form class="box" method="post" action="{{ base_path }}/login"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><div class="mark"></div><div class="eyebrow">Bite Binary · Pharmacy intelligence</div><h1>Welcome to MedScan</h1><p>One secure product for Maker review, Checker sign-off, and central purchase intelligence.</p>{% if error %}<div class="error">{{ error }}</div>{% endif %}<div class="field"><label for="username">Username</label><input id="username" name="username" autocomplete="username" required autofocus></div><div class="field"><label for="password">Password</label><input id="password" type="password" name="password" autocomplete="current-password" required></div><button>Sign in securely</button><div class="flow"><b>Maker</b> → <b>Checker</b> → <b>Central system</b></div></form></body></html>
